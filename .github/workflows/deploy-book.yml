name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook & plugins
        run: |
          mkdir -p bin
          
          # Install mdBook
          tag=$(curl -s "https://api.github.com/repos/rust-lang/mdBook/releases/latest" | jq -r .tag_name)
          url="https://github.com/rust-lang/mdBook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz --directory=bin
          
          # Install mdbook-mermaid
          mermaid_tag=$(curl -s "https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest" | jq -r .tag_name)
          mermaid_url="https://github.com/badboy/mdbook-mermaid/releases/download/${mermaid_tag}/mdbook-mermaid-${mermaid_tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$mermaid_url" | tar -xz --directory=bin
          
          # Install mdbook-alerts (for GitHub-style > [!TIP], > [!WARNING] cards)
          alerts_tag=$(curl -s "https://api.github.com/repos/lambdalisue/rs-mdbook-alerts/releases/latest" | jq -r .tag_name)
          alerts_url="https://github.com/lambdalisue/rs-mdbook-alerts/releases/download/${alerts_tag}/mdbook-alerts-x86_64-unknown-linux-gnu"
          curl -sSL "$alerts_url" -o bin/mdbook-alerts
          chmod +x bin/mdbook-alerts

          # Install mdbook-pagetoc (for floating table of contents)
          pagetoc_tag=$(curl -s "https://api.github.com/repos/slowsage/mdbook-pagetoc/releases/latest" | jq -r .tag_name)
          pagetoc_url="https://github.com/slowsage/mdbook-pagetoc/releases/download/${pagetoc_tag}/mdbook-pagetoc-${pagetoc_tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$pagetoc_url" | tar -xz --directory=bin
          
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build with mdBook
        run: |
          bin/mdbook-mermaid install .
          bin/mdbook-pagetoc install .
          bin/mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
